name: Setup
description: Install Bun and the project dependencies with caching

runs:
    using: composite
    steps:
        # Reads the exact version from `packageManager` in package.json, so
        # the local and CI toolchains cannot drift.
        - name: Install Bun
          uses: oven-sh/setup-bun@v2

        # Bun's download cache; keyed on the lockfile so a dependency bump
        # invalidates it.
        - name: Cache the package store
          uses: actions/cache@v5
          with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

        - name: Install dependencies
          shell: bash
          run: bun install --frozen-lockfile
