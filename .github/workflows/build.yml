name: build

on:
    push:
        branches: [master]
    pull_request:
        branches: [master, SDTTTTT]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: format
              run: pnpm format

            - name: format check
              run: pnpm format:check

            - name: lint
              run: pnpm lint

            - name: test
              run: pnpm test

            - name: package
              run: pnpm dlx @vscode/vsce@4.1.0 package --no-dependencies

            - uses: actions/upload-artifact@v4
              with:
                  path: ./**/*.vsix
