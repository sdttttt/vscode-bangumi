name: build

on:
    push:
        branches: [master]
    pull_request:
        branches: [master, SDTTTTT]
    # Called by `release.yml` so a tag can never ship an unverified build.
    workflow_call:
        inputs:
            artifact:
                description: Name of the VSIX artifact to upload, empty to skip
                type: string
                default: ""
        outputs:
            artifact:
                description: Name of the uploaded VSIX artifact, empty when skipped
                value: ${{ jobs.package.outputs.artifact }}

# A newer push to the same ref makes the previous run pointless, but a release
# must never be cancelled half way through.
concurrency:
    group: build-${{ github.ref }}
    cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
    contents: read

env:
    CI: true

jobs:
    quality:
        name: Format, lint, types
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup

            - name: format check
              run: pnpm format:check

            - name: lint
              run: pnpm lint

            - name: typecheck
              run: pnpm typecheck

    test:
        name: Test and coverage
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup

            # `pnpm test:coverage` runs the whole suite, so a separate
            # `pnpm test` would only repeat the same work.
            - name: test
              run: pnpm test:coverage

            - name: upload coverage report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: coverage
                  path: coverage/lcov.info
                  if-no-files-found: ignore
                  retention-days: 7

    package:
        name: Package VSIX
        needs: [quality, test]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        outputs:
            artifact: ${{ steps.name.outputs.artifact }}
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup

            # A tag run reuses the VSIX built here, so the marketplaces and the
            # GitHub release always ship the artifact the checks ran against.
            - name: resolve artifact name
              id: name
              run: |
                  set -eu
                  name="${{ inputs.artifact }}"
                  if [ -z "$name" ]; then
                      name="vsix-${{ github.ref_name }}"
                  fi
                  echo "artifact=$name" >> "$GITHUB_OUTPUT"

            # `vsce` runs the `vscode:prepublish` script (which is `pnpm build`)
            # itself, so there is no separate build step here.
            - name: package
              run: pnpm package --out bangumiopen.vsix

            - name: upload VSIX
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ steps.name.outputs.artifact }}
                  path: bangumiopen.vsix
                  if-no-files-found: error
                  retention-days: 14
