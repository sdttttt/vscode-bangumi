name: probe-ovsx

on:
    workflow_dispatch:

permissions:
    id-token: write
    contents: read

jobs:
    probe:
        runs-on: ubuntu-latest
        environment: production
        steps:
            - name: fetch the oidc token and print its claims
              run: |
                  set -eu
                  token="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                      "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=openvsx" | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).value')"
                  echo "$token" | cut -d. -f2 | base64 -d 2>/dev/null | node -e '
                  let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{
                    const c=JSON.parse(d);
                    console.log("iss:        ", c.iss);
                    console.log("aud:        ", c.aud);
                    console.log("repository: ", c.repository);
                    console.log("ref:        ", c.ref);
                    console.log("environment:", c.environment);
                    console.log("event_name: ", c.event_name);
                    console.log("workflow:   ", c.workflow_ref ?? c.job_workflow_ref);
                  });'
