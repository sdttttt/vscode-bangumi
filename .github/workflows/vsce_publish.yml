name: VSCE Publish

on:
    push:
        tags:
            - "v**"

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4

            - name: Use Node.js 22
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Publish to Visual Studio Marketplace
              run: pnpm dlx @vscode/vsce publish --no-dependencies -p ${{ secrets.VSCE_TOKEN }}

            - name: Publish to Open-VSX
              run: pnpm dlx ovsx publish -p ${{ secrets.OVSX_ACCESS_KEY }}
